name: Sync v1.6 source to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and commit complete source
        shell: bash
        run: |
          unzip -oq mozhou-source-v1.6.zip -d .
          rm -f .github/workflows/sync-v1.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source is already synchronized."
            exit 0
          fi
          git commit -m "Sync complete v1.6 source"
          git push origin HEAD:main
